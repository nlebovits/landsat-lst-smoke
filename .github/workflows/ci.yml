# Runs the same gates as the prek hooks, so a pull request cannot land
# what a local commit would refuse. Nothing passes with warnings.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Check formatting
        run: uvx ruff@0.14.1 format --check .

      - name: Lint
        run: uvx ruff@0.14.1 check .

      # Same list as the vulture hook in prek.toml. If they drift, a module
      # gets checked locally and not here, or the other way round.
      - name: Dead code
        run: |
          uvx vulture@2.14 \
            aster_ged.py cog_catalog.py compare_qa_masks.py cost_report.py \
            fleet_plan.py \
            land_tiles.py masks.py measure_ged_registration.py \
            measure_land_defects.py measure_s3_requests.py \
            measure_scene_centre.py measure_shard_memory.py \
            memory_sampler.py \
            profile_lst_p95.py shard_lst_p95.py \
            stac_reference.py stac_window.py staging.py sweep_throughput.py \
            tile_inventory.py usgs_inventory.py dryrun \
            vulture_whitelist.py --min-confidence 80

      - name: Spell check
        run: |
          uvx codespell \
            --skip "*.csv,*.json,*.log,*.npz,*.tif,.git" \
            $(git ls-files '*.py' '*.md')

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the dev environment
        run: uv sync --group dev --frozen

      # --extra-search-path puts the repository root on the module path.
      # measure_s3_requests.py imports shard_lst_p95 after a sys.path insert.
      # tests/ goes on it too, because pytest puts it there and the test
      # modules import their shared fixtures from conftest by name.
      - name: ty
        run: uv run ty check --extra-search-path . --extra-search-path tests

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the dev environment
        run: uv sync --group dev --frozen

      - name: pytest
        run: uv run pytest

      # A script has to run on the dependencies its own PEP 723 block declares,
      # not on the dev group, which is the union of every script's. The suite
      # above runs inside that union and cannot tell the two apart. This step
      # can: it copies the scripts to a fresh path and runs them there, which
      # is what a fleet instance holds after git clone. A missing line here
      # once cost a live c6id.16xlarge.
      - name: Script environments resolve on their own metadata
        run: uv run pytest -m packaging
