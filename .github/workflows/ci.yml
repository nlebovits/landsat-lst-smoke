# Runs the same gates as the prek hooks, so a pull request cannot land
# what a local commit would refuse. Nothing passes with warnings.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Check formatting
        run: uvx ruff@0.14.1 format --check .

      - name: Lint
        run: uvx ruff@0.14.1 check .

      # Same arguments as the vulture hook in prek.toml. Both name the package
      # rather than a list of files, so the two cannot drift the way the two
      # 22-entry lists they replaced did.
      - name: Dead code
        run: uvx vulture@2.14 src/lst fleet/upload.py --min-confidence 80

      # Imported names against declared ones. This is the gate that would have
      # caught `pystac`, `botocore` and `affine` being imported and declared
      # nowhere, and it found `planetary-computer`, `rioxarray` and `rich`
      # declared and imported nowhere. Configured in pyproject.toml.
      - name: Dependency declarations
        run: uvx deptry@0.23.1 . --no-ansi

      - name: Spell check
        run: |
          uvx codespell \
            --skip "*.csv,*.json,*.log,*.npz,*.tif,.git" \
            $(git ls-files '*.py' '*.md')

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the dev environment
        run: uv sync --group dev --frozen

      # `tests/` on the search path because the test modules import their
      # shared fixtures from `conftest` by bare name, the way pytest resolves
      # them. `fleet/` because tests/test_fleet_launch.py imports `upload`,
      # which is deliberately outside the package. Same flags as prek.toml.
      - name: ty
        run: uv run ty check --extra-search-path tests --extra-search-path fleet

      # The layering `src/lst/__init__.py` describes, stated as contracts.
      # import-linter reads the package's import graph, so it is installed in
      # the environment rather than run through uvx, which would give it an
      # environment where `lst` does not exist.
      - name: Import contracts
        run: uv run lint-imports --no-logo

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install the dev environment
        run: uv sync --group dev --frozen

      - name: pytest
        run: uv run pytest

      # An instance runs on `[project] dependencies` alone, not on the dev
      # group the suite above runs inside, and that suite cannot tell the two
      # apart. This step can: it builds a checkout at a fresh path, runs
      # `uv sync --frozen --no-dev` there exactly as `fleet/run.sh` does, and
      # then runs the console scripts. A missing line here once cost a live
      # c6id.16xlarge.
      #
      # Its own step rather than part of the run above, because `addopts`
      # deselects the `packaging` mark. A green default run says nothing about
      # these.
      - name: A clean checkout syncs and runs
        run: uv run pytest -m packaging
