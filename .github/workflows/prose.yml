# Vale and proselint over the handwritten prose. The rules live in styles/
# and their provenance in styles/NOTICE. docs/PROSE.md explains them.
#
# The gate is `--minAlertLevel=error`. The suggestion-level audit runs too,
# and reports without failing, so a drift shows up in the log before it
# becomes a blocker.
#
# tests/test_prose_styles.py runs first. It asserts that every repository-owned
# rule still reports its failing example and accepts its passing one, that the
# four pinned packages are active, and that the rules .vale.ini turns off stay
# off. A package bump that renames a rule fails there rather than silently
# widening or narrowing the gate.
name: Prose

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  VALE_VERSION: "3.19.0"

jobs:
  prose:
    name: Vale and proselint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-extras --frozen

      - name: Install Vale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v${VALE_VERSION}" \
            --repo vale-cli/vale \
            --pattern "vale_${VALE_VERSION}_Linux_64-bit.tar.gz" \
            --output vale.tar.gz
          tar xzf vale.tar.gz vale
          sudo install -m 0755 vale /usr/local/bin/vale
          vale --version

      - name: Fetch the pinned style packages
        run: vale sync

      - name: Test repository-owned rules
        run: uv run pytest -q -p no:randomly tests/test_prose_styles.py

      # AGENTS.md is generated context, and the measurement directories hold
      # retained evidence. .vale.ini already gives all of them an empty
      # BasedOnStyles, but proselint has no per-path config, so the exclusions
      # live in the file list here as well. Keep the two lists the same.
      - name: Report every Vale finding
        run: |
          mapfile -d '' files < <(
            git ls-files -z -- '*.md' '*.mdx' \
              ':(exclude)AGENTS.md' \
              ':(exclude).claude/**' \
              ':(exclude)docs/evidence/**' \
              ':(exclude)results/**' \
              ':(exclude)ec2-results/**' \
              ':(exclude)fulltile/**' \
              ':(exclude)smoke/**' \
              ':(exclude)smoke2/**' \
              ':(exclude)split/**' \
              ':(exclude)sweep/**' \
              ':(exclude)dryrun/**'
          )
          if ((${#files[@]})); then
            vale --minAlertLevel=suggestion --output=line "${files[@]}" || true
          fi

      - name: Report proselint findings
        run: |
          mapfile -d '' files < <(
            git ls-files -z -- '*.md' '*.mdx' \
              ':(exclude)AGENTS.md' \
              ':(exclude).claude/**' \
              ':(exclude)docs/evidence/**' \
              ':(exclude)results/**' \
              ':(exclude)ec2-results/**' \
              ':(exclude)fulltile/**' \
              ':(exclude)smoke/**' \
              ':(exclude)smoke2/**' \
              ':(exclude)split/**' \
              ':(exclude)sweep/**' \
              ':(exclude)dryrun/**'
          )
          if ((${#files[@]})); then
            uvx --from proselint==0.16.0 proselint check \
              --config proselint.json "${files[@]}" || true
          fi

      - name: Gate handwritten documentation
        run: |
          mapfile -d '' files < <(
            git ls-files -z -- '*.md' '*.mdx' \
              ':(exclude)AGENTS.md' \
              ':(exclude).claude/**' \
              ':(exclude)docs/evidence/**' \
              ':(exclude)results/**' \
              ':(exclude)ec2-results/**' \
              ':(exclude)fulltile/**' \
              ':(exclude)smoke/**' \
              ':(exclude)smoke2/**' \
              ':(exclude)split/**' \
              ':(exclude)sweep/**' \
              ':(exclude)dryrun/**'
          )
          if ((${#files[@]})); then
            vale --minAlertLevel=error --output=line "${files[@]}"
          fi
