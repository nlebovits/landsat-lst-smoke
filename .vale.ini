# Prose rules for landsat-lst-smoke. Adapted from portolan-sdi/portolan-ops.
# See styles/NOTICE for the source commit and the list of changes.
#
# Three repository-owned layers apply to every prose file:
#   Landsat-Terms      the vocabulary this repository writes
#   Landsat-Mechanics  punctuation, capitalization, spacing
#   Landsat-Voice      the voice rules every surface shares
#
# Landsat-Docs adds the sentence-length ceiling.
#
# The ai-tells package adds the rules the Landsat styles cannot match:
# figurative language, hype words, and filler. Six of its rules are off. Each
# disable below states the reason.
#
# Vale replaces BasedOnStyles on the most specific matching glob rather than
# merging it, so every section names each style it needs.

StylesPath = styles
MinAlertLevel = suggestion

# A term listed in styles/config/vocabularies/Landsat/accept.txt is skipped by
# every other check. Keep a word out of accept.txt when a rule must match on it.
Vocab = Landsat
Packages = https://github.com/errata-ai/Google/releases/download/v0.7.1/Google.zip, https://github.com/vale-cli/Microsoft/releases/download/v0.15.1/Microsoft.zip, https://github.com/vale-cli/readability/releases/download/v0.1.1/Readability.zip, https://github.com/tbhb/vale-ai-tells/releases/download/v1.33.0/ai-tells.zip

# Docs voice. READMEs, findings, and reports.
[*.{md,mdx}]
BasedOnStyles = Vale, Landsat-Terms, Landsat-Mechanics, Landsat-Voice, Landsat-Docs, Google, Microsoft, Readability, ai-tells

Vale.Spelling = NO
TokenIgnores = (`[^`]+`), ([\w.-]+/[\w.-]+), ([a-z0-9]+(?:-[a-z0-9]+)+)
BlockIgnores = (?s)<claude-mem-context>.*?</claude-mem-context>, (?s)<!-- ops-sync:begin.*?<!-- ops-sync:end -->

# Findings repeat technical terms deliberately. Keep future repetition visible
# through the formulaic-voice rules instead of Vale's generic matcher.
Vale.Repetition = NO

# Google rules that fight the local voice or duplicate a repository rule.
Google.We = NO
Google.Contractions = NO
Google.WordList = NO
Google.Headings = NO
Google.Parens = NO
Google.Quotes = NO
Google.Acronyms = NO
Google.Colons = NO
Google.Passive = NO
Google.OxfordComma = NO
Google.Ellipses = NO
# Landsat-Mechanics.EmDash owns the em dash. It is spaced here; Google's is not.
Google.EmDash = NO
# Reports 'supply-chain', which is a correct compound adjective.
Google.LyHyphens = NO

# Keep Microsoft checks that add distinct editorial value. These checks either
# conflict with local conventions, duplicate a repository rule, or produce
# domain-specific false positives.
Microsoft.Contractions = NO
Microsoft.Auto = NO
Microsoft.Avoid = NO
Microsoft.Dashes = NO
Microsoft.Ellipses = NO
Microsoft.FirstPerson = NO
Microsoft.Foreign = NO
Microsoft.GeneralURL = NO
Microsoft.HeadingColons = NO
Microsoft.HeadingPunctuation = NO
Microsoft.Headings = NO
Microsoft.Negative = NO
Microsoft.OxfordComma = NO
Microsoft.Passive = NO
Microsoft.Percentages = NO
Microsoft.Plurals = NO
Microsoft.Quotes = NO
Microsoft.Semicolon = NO
Microsoft.SentenceLength = NO
Microsoft.Spacing = NO
Microsoft.Terms = NO
Microsoft.Units = NO
Microsoft.Uppercase = NO
Microsoft.Vocab = NO

# ARI and Flesch Reading Ease are enough to show a trend. Their targets remain
# suggestions because technical names unavoidably raise prose scores.
Readability.ColemanLiau = NO
Readability.FleschKincaid = NO
Readability.GunningFog = NO
Readability.LIX = NO
Readability.SMOG = NO

# ai-tells rules that conflict with a rule this repository already owns, or
# that report an exact technical word.
#
# It bans the em dash. Landsat-Mechanics.EmDash requires a spaced em dash and
# limits the count per file. Keep one owner.
ai-tells.EmDashUsage = NO
# Google.Semicolons stays on. Keep one rule for the semicolon.
ai-tells.SemicolonUsage = NO
# Its message gives the contraction "doesn't" as the fix. Google.Contractions
# is off here, and Simplified Technical English allows only full verb forms.
ai-tells.NegatedObject = NO
# It reports "implements", which is the exact word for what a script does.
ai-tells.FormalRegister = NO
# It reports a run-in bold label, such as "**Note:** ...", which the docs use
# to open a paragraph. vale-ai-tells turns it off in its own repository.
ai-tells.ColonUsage = NO
# Every match is a CLI flag inside a code span, such as `uv run pytest --lf`.
# Vale masks a code span before it matches, but a punctuation token still
# reports at the raw position inside the mask. tbhb/vale-ai-tells records the
# limitation in its TODO.md.
ai-tells.DoubleHyphen = NO

# Generated context and retained evidence are not handwritten documentation.
[AGENTS.md]
BasedOnStyles =

[.claude/**]
BasedOnStyles =

[{dryrun,ec2-results,full,fulltile,smoke,smoke2,split,sweep}/**]
BasedOnStyles =

[**/{docs/evidence,results}/**]
BasedOnStyles =

# Vendored, generated, or machine-written text.
[**/{node_modules,.venv,venv,vendor,site-packages,worktrees,.git,__pycache__,.pytest_cache}/**]
BasedOnStyles =

# The Contributor Covenant, reproduced verbatim. Do not restyle it.
[**/CODE_OF_CONDUCT.md]
BasedOnStyles =

[**/{LICENSE,LICENCE,COPYING,NOTICE,CHANGELOG,conformance}*.{md,mdx}]
BasedOnStyles =
