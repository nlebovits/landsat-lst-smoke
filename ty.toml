# ty settings.
#
# Three directories, and between them they are everything. The previous version
# of this file listed 20 root filenames and carried a comment saying the list
# was not everything: it omitted aster_ged, lst_qa, masks, measure_tile_seam,
# publish_catalog, stage_bench and all of fleet/, so seven modules were not
# type-checked at all. Naming the package instead makes the omission
# impossible rather than documented.

# The two extra search paths stay on the command line, in prek.toml and
# .github/workflows/ci.yml: `--extra-search-path tests --extra-search-path
# fleet`. The equivalent `[environment] extra-paths` key here is read and has
# no effect, which was measured rather than assumed.
#
# `tests/` because the test modules import their shared fixtures from `conftest`
# by bare name, the way pytest resolves them. `fleet/` because
# `tests/test_fleet_launch.py` imports `upload`, which lives there and not in
# the package.

[src]
include = [
  "src/lst",
  "tests",
  # Not part of the package, and checked anyway. `fleet/drive.sh` copies this
  # to an instance outside the checkout and runs it there on its own inline
  # block, so it cannot import from `lst`. That is the reason it sits outside,
  # not a reason to leave it unchecked.
  "fleet/upload.py",
]
