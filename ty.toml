# ty settings. The repository has no package, so `src.include` names the files
# to check rather than a source root.
#
# The search path for `measure_s3_requests.py`, which imports shard_lst_p95
# after a sys.path insert, comes from `--extra-search-path .` on the command
# line. The equivalent `[environment] extra-paths` key has no effect for this
# layout, so both prek.toml and .github/workflows/ci.yml pass the flag.

[src]
# vulture_whitelist.py is deliberately unresolvable: a vulture whitelist names
# symbols that exist nowhere, which is the format. Everything else is checked.
include = [
  "compare_qa_masks.py",
  "cost_report.py",
  "fleet_plan.py",
  "land_tiles.py",
  "measure_land_defects.py",
  "measure_s3_requests.py",
  "measure_scene_centre.py",
  "measure_shard_memory.py",
  "memory_sampler.py",
  "profile_lst_p95.py",
  "shard_lst_p95.py",
  "staging.py",
  "stac_reference.py",
  "stac_window.py",
  "tile_inventory.py",
  "usgs_inventory.py",
  "sweep_throughput.py",
  "dryrun",
  "tests",
]
