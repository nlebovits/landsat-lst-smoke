# This repository is a set of standalone PEP 723 benchmark scripts. Each one
# still declares its own inline dependencies and still runs with `uv run
# <script>.py` against a per-script environment.
#
# This file exists so that the quality gates have somewhere to resolve
# against. `ty` cannot type-check an import it cannot find, and pytest cannot
# import a script whose dependencies are not installed. The `dev` group is the
# union of every script's inline block, plus the two tools.
#
# Keep the two in step. A dependency added to a script's PEP 723 block belongs
# here as well.

[project]
name = "landsat-lst-smoke"
version = "0.0.0"
description = "Profiling a p95 composite of land surface temperature"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = [
  # The union of the inline blocks in shard_lst_p95.py, composite.py,
  # measure_s3_requests.py and compare_qa_masks.py. cost_report.py is standard
  # library only.
  "rasterio",
  "frisky>=0.7.2",
  # Pinned: frisky 0.7.2 imports the private `dask._task_spec` and
  # `dask._expr` modules and declares no dask bound of its own.
  "dask==2026.8.0",
  "odc-stac",
  # The graph reprojects the cross-fade weights and reads the tile geobox
  # through odc.geo, so it is a direct dependency and not odc-stac's.
  "odc-geo",
  "pystac-client",
  "planetary-computer",
  "xarray",
  "numpy",
  "geopandas",
  "rioxarray",
  # Staging fetches each scene object once, with one get_object per object.
  "boto3",
  # The COG and catalog writer, cog_catalog.py. rasterio, listed above, writes
  # the GeoTIFF and drives GDAL's COG driver; stac-geoparquet writes the item
  # mirror.
  "stac-geoparquet",
  # The precompute stage: land_tiles.py and usgs_inventory.py. DuckDB and
  # pyarrow do the column projection, filtering and Parquet writing; the bulk
  # metadata table never becomes a pandas frame.
  "duckdb>=1.0",
  "pyarrow>=16",
  # The output mask. `aster_ged.py` reads the ASTER GED granules with h5py and
  # fetches them with earthaccess, both at build time only; `masks.py` and the
  # fleet read the GeoTIFF and the GeoPackage those produce.
  "h5py",
  "earthaccess",
  "pyproj",
  "shapely",
  "pyogrio",
  "requests",
  "matplotlib",
  "psutil",
  "rich",
  # Gates.
  "ty>=0.0.1a14",
  "pytest>=8",
  "pytest-timeout>=2.3",
  # The slow tests each drive a real frisky cluster in a subprocess, so the
  # suite is latency-bound rather than CPU-bound and parallelises well. See
  # `addopts` below for why the worker count is fixed rather than `auto`.
  "pytest-xdist>=3.6",
  # The Portolan conformance validator. tests/test_cog_catalog.py runs it
  # against a catalog built in tmp_path, so CI fails on a non-conformant COG.
  # 0.1.8 is the first release carrying the v0.2.0 rules the writer targets.
  "rashid>=0.1.8",
]

[tool.uv]
# Nothing here is importable as a package. Without this, uv tries to build and
# install the repository into its own environment and fails on the missing
# module.
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are opt-in. They query Earth Search as a parity oracle, which
# is slow and depends on a public service being up, so the default run and CI
# skip them.
#
# The two marks are independent and `test_load_parity.py` carries both: it
# queries the catalogue and then reads the bucket. So `-m network` alone bills
# S3. The catalogue-only run is:
#
#     uv run pytest -m "network and not s3"     # free, Earth Search only
#     AWS_PROFILE=... uv run pytest -m s3       # costs money
#     uv run pytest -m packaging                # resolves the script env
# `-n 4 --dist loadfile`. The slow tests each drive a real frisky cluster in a
# subprocess and spend most of their time waiting on it, so the suite is
# latency-bound and shortens under parallelism even where the workers outnumber
# the cores. Measured over the whole suite, with the barren-tile fixture
# already module-scoped:
#
#     16 cores, serial    196 s
#     16 cores, -n 4      146 s
#      4 cores, -n 4      148 s   `taskset -c 0-3`, emulating the runner
#
# Four, not `auto`. `auto` reads the core count, which is 4 on the
# `ubuntu-latest` runner and 16 on a development machine. Four matches the
# runner exactly, so a `--timeout=60` failure reproduces locally rather than
# only in CI. No test came near the timeout in the four-core run.
#
# Measure on an idle machine. A number taken while another checkout's suite was
# running read half again as long, which is worth knowing before anyone trusts
# a figure from a busy laptop.
#
# `loadfile` rather than the default, because several modules hold
# module-scoped fixtures that drive a whole pipeline. Splitting a module across
# workers would rebuild each one per worker.
#
# This applies to every invocation, debugging included. A single test now runs
# on a worker, which swallows live output and disables `--pdb`. Pass `-n 0` to
# get the serial run back:
#
#     uv run pytest -n 0 -x tests/test_fleet_plan.py
addopts = "-q --timeout=60 -n 4 --dist loadfile -m 'not network and not s3 and not packaging'"
# odc-geo multiplies affines with `*`, which the affine package now flags on
# every call. Tens of thousands of copies of that one line bury a failure.
filterwarnings = [
  "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning",
]
markers = [
  "network: reaches Earth Search or the USGS bulk metadata service",
  "s3: reads s3://usgs-landsat, which is requester-pays and costs money",
  "packaging: runs a script in its own PEP 723 environment, which resolves against PyPI",
]
