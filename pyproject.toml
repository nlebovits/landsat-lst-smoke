# The code is one installed package, `lst`, under `src/`. This file is where
# its dependencies are declared, once.
#
# It used to be otherwise. Every script carried a PEP 723 inline block and ran
# with `uv run <script>.py` against a per-script environment, and this file
# held a `dev` group described as "the union of every script's inline block".
# It was not the union. deptry found `pystac` in five blocks and not here, and
# `botocore` and `affine` imported and declared nowhere at all. Two
# declarations of the same fact drift, and a comment asking the next person to
# keep them in step does not stop that.
#
# One exception remains, and it is deliberate: `fleet/upload.py` keeps its
# inline block. `fleet/drive.sh` copies it to an instance outside the checkout
# and runs it there, so it has to resolve without this project.

[project]
name = "landsat-lst-smoke"
version = "0.0.0"
description = "Profiling a p95 composite of land surface temperature"
requires-python = ">=3.12,<3.15"
dependencies = [
  "rasterio",
  # `destripe.py` imports `affine` directly, to build the swath transform. It
  # arrives with rasterio today, so the import works and nothing declares it.
  # deptry reports it as DEP001, which is correct: a rasterio release that
  # stopped depending on affine would break de-striping and no gate would say
  # why.
  "affine",
  "frisky>=0.7.2",
  # Pinned: frisky 0.7.2 imports the private `dask._task_spec` and
  # `dask._expr` modules and declares no dask bound of its own.
  "dask==2026.8.0",
  "odc-stac",
  # The graph reprojects the cross-fade weights and reads the tile geobox
  # through odc.geo, so it is a direct dependency and not odc-stac's.
  "odc-geo",
  # `composite.py` and `tile_prep.py` call `pystac.Item.from_dict` on the item
  # dicts the inventory hands them, so pystac is read directly and not only
  # through pystac-client. Five inline blocks already declare it. This one did
  # not, which is the drift the comment above this list claims cannot happen.
  "pystac",
  "pystac-client",
  "xarray",
  "numpy",
  "geopandas",
  # Staging fetches each scene object once, with one get_object per object.
  "boto3",
  # `staging.py` builds its own `botocore.config.Config`, because the two
  # defaults it has to override, the retry mode and the connection pool size,
  # are set nowhere else. boto3 pulls botocore in, so the import works; the
  # settings it configures are the reason `staging.json` can count requests.
  "botocore",
  # The COG and catalog writer, cog_catalog.py. rasterio, listed above, writes
  # the GeoTIFF and drives GDAL's COG driver; stac-geoparquet writes the item
  # mirror.
  "stac-geoparquet",
  # The precompute stage: land_tiles.py and usgs_inventory.py. DuckDB and
  # pyarrow do the column projection, filtering and Parquet writing; the bulk
  # metadata table never becomes a pandas frame.
  "duckdb>=1.0",
  "pyarrow>=16",
  # The output mask. `aster_ged.py` reads the ASTER GED granules with h5py and
  # fetches them with earthaccess, both at build time only; `masks.py` and the
  # fleet read the GeoTIFF and the GeoPackage those produce.
  "h5py",
  "earthaccess",
  "pyproj",
  "shapely",
  # geopandas' IO engine, and never imported by name. With it installed,
  # `read_file(bbox=...)` pushes the filter into GDAL and reads only the
  # polygons that meet the bbox; without it geopandas falls back to fiona and
  # reads the lot. See the note at `lst/masks.py:136`. deptry reports it as
  # DEP002 for that reason, and `[tool.deptry] ignore` names it.
  "pyogrio",
  "requests",
  "matplotlib",
  "psutil",
]

# Every command the pipeline and the fleet expose. `fleet/run.sh` calls
# `lst-prep` and `lst-shard`; `fleet/README.md` documents the rest. A console
# script resolves wherever the package is installed, which is what lets the
# instance stop caring where in the tree a module sits.
[project.scripts]
lst-prep = "lst.tile_prep:main"
lst-shard = "lst.shard_lst_p95:main"
lst-land-tiles = "lst.land_tiles:main"
lst-inventory = "lst.usgs_inventory:main"
lst-aster-ged = "lst.aster_ged:main"
lst-fleet-plan = "lst.fleet.planner:main"
lst-fleet-launch = "lst.fleet.launch:main"
lst-fleet-watch = "lst.fleet.watch:main"
lst-fleet-teardown = "lst.fleet.teardown:main"
lst-cost-report = "lst.fleet.cost_report:main"
lst-publish-catalog = "lst.fleet.publish_catalog:main"
lst-measure-qa-masks = "lst.measure.compare_qa_masks:main"
lst-measure-ged-registration = "lst.measure.ged_registration:main"
lst-measure-land-defects = "lst.measure.land_defects:main"
lst-measure-s3-requests = "lst.measure.s3_requests:main"
lst-measure-scene-centre = "lst.measure.scene_centre:main"
lst-measure-tile-seam = "lst.measure.tile_seam:main"
lst-stage-bench = "lst.measure.stage_bench:main"

[dependency-groups]
# The gates and the test tooling, and nothing else. An instance installs the
# project without this group:
#
#     uv sync --frozen --no-dev
#
# Not `--only-group`. That installs a group *instead of* the project, so the
# console scripts above would not exist on the box.
dev = [
  "ty>=0.0.1a14",
  # Reads the import graph of `lst`, so it has to be installed beside it. `uvx`
  # gives it an isolated environment where the package does not exist and it
  # reports "Could not find package 'lst'", which reads like a broken config
  # rather than a missing install.
  "import-linter>=2.15",
  "pytest>=8",
  "pytest-timeout>=2.3",
  # The slow tests each drive a real frisky cluster in a subprocess, so the
  # suite is latency-bound rather than CPU-bound and parallelises well. See
  # `addopts` below for why the worker count is fixed rather than `auto`.
  "pytest-xdist>=3.6",
  # The Portolan conformance validator. tests/test_cog_catalog.py runs it
  # against a catalog built in tmp_path, so CI fails on a non-conformant COG.
  # 0.1.8 is the first release carrying the v0.2.0 rules the writer targets.
  "rashid>=0.1.8",
]

# Imported names against declared dependencies. Two entries, and both are
# naming gaps rather than suppressions.
[tool.deptry]
# The package's own name. `src/lst/*` imports `lst.*`, which is first-party and
# not a missing dependency.
known_first_party = ["lst"]

[tool.deptry.per_rule_ignores]
# DEP002 is "declared but never imported". deptry found four. Three were real
# and are gone: `planetary-computer`, which only ever appeared as a refused
# `--source` choice; `rioxarray`, which appeared only inside a usage snippet
# the catalog writer emits for its readers; and `rich`, which nothing imported
# at all.
#
# `pyogrio` is the fourth and it stays. geopandas loads it as an IO engine
# rather than this code importing it, and which engine is present changes
# whether a bbox filter is pushed into GDAL.
DEP002 = ["pyogrio"]

[tool.deptry.package_module_name_map]
# Distribution name to the module it provides. `odc-stac` and `odc-geo` are
# separate distributions sharing the `odc` namespace package, so neither
# distribution name matches the import name and deptry cannot infer the link.
"odc-stac" = ["odc"]
"odc-geo" = ["odc"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The distribution is `landsat-lst-smoke` and the import name is `lst`, so the
# package directory has to be named rather than inferred.
packages = ["src/lst"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Network tests are opt-in. They query Earth Search as a parity oracle, which
# is slow and depends on a public service being up, so the default run and CI
# skip them.
#
# The two marks are independent and `test_load_parity.py` carries both: it
# queries the catalogue and then reads the bucket. So `-m network` alone bills
# S3. The catalogue-only run is:
#
#     uv run pytest -m "network and not s3"     # free, Earth Search only
#     AWS_PROFILE=... uv run pytest -m s3       # costs money
#     uv run pytest -m packaging                # resolves the script env
# `-n 4 --dist loadfile`. The slow tests each drive a real frisky cluster in a
# subprocess and spend most of their time waiting on it, so the suite is
# latency-bound and shortens under parallelism even where the workers outnumber
# the cores. Measured over the whole suite, with the barren-tile fixture
# already module-scoped:
#
#     16 cores, serial    196 s
#     16 cores, -n 4      146 s
#      4 cores, -n 4      148 s   `taskset -c 0-3`, emulating the runner
#
# Four, not `auto`. `auto` reads the core count, which is 4 on the
# `ubuntu-latest` runner and 16 on a development machine. Four matches the
# runner exactly, so a `--timeout=60` failure reproduces locally rather than
# only in CI. No test came near the timeout in the four-core run.
#
# Measure on an idle machine. A number taken while another checkout's suite was
# running read half again as long, which is worth knowing before anyone trusts
# a figure from a busy laptop.
#
# `loadfile` rather than the default, because several modules hold
# module-scoped fixtures that drive a whole pipeline. Splitting a module across
# workers would rebuild each one per worker.
#
# This applies to every invocation, debugging included. A single test now runs
# on a worker, which swallows live output and disables `--pdb`. Pass `-n 0` to
# get the serial run back:
#
#     uv run pytest -n 0 -x tests/test_fleet_plan.py
addopts = "-q --timeout=60 -n 4 --dist loadfile -m 'not network and not s3 and not packaging'"
# odc-geo multiplies affines with `*`, which the affine package now flags on
# every call. Tens of thousands of copies of that one line bury a failure.
filterwarnings = [
  "ignore:Use `@` matmul instead of `\\*` mul operator:PendingDeprecationWarning",
]
markers = [
  "network: reaches Earth Search or the USGS bulk metadata service",
  "s3: reads s3://usgs-landsat, which is requester-pays and costs money",
  "packaging: runs a script in its own PEP 723 environment, which resolves against PyPI",
]
