# prek configuration.
# Install: prek install (requires: uv tool install prek)
#
# Adapted from nlebovits/landsat-lst. That repository is a package with
# src/ and a pyproject.toml; this one is a set of standalone PEP 723
# benchmark scripts and the evidence they produced. pyproject.toml here
# exists so the gates have somewhere to resolve against, not to make the
# repository importable.

fail_fast = true

# Measurement artifacts. The whitespace hooks would rewrite committed
# evidence, and none of it is handwritten. One prefix, because the nine
# directories now live under it: naming them individually gave four configs
# four different lists, and three of those listed directories that had never
# existed here.
exclude = "^(evidence/|.*\\.log$)"

# =============================================================================
# Built-in hooks (native Rust, no network fetch required)
# =============================================================================
[[repos]]
repo = "builtin"
hooks = [
  # --- Format & whitespace ---
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },

  # --- Syntax validation ---
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },

  # --- Safety & security ---
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "check-case-conflict" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
  {
    id = "check-added-large-files",
    args = ["--maxkb=500"],
    # One committed memory series predates this config: a 100 ms psutil
    # sample over an 18.6 min run. It is the evidence behind the memory
    # findings and no summary replaces it. Excluded by exact path, so the
    # 500 KB ceiling still catches a COG or a parquet committed by accident.
    exclude = { glob = ["evidence/ec2-results/quartertile/qt-v2/memory.csv"] },
  },
]

# =============================================================================
# External tool hooks
# =============================================================================
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.14.1"
hooks = [
  { id = "ruff", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/jendrikseipp/vulture"
rev = "v2.14"
hooks = [
  {
    id = "vulture",
    # One directory, not a list of files. This used to name 22 modules, and the
    # same 22 were written again in .github/workflows/ci.yml with a comment
    # asking the next person to keep them in step. They did not stay in step:
    # both copies omitted lst_qa, stage_bench, measure_tile_seam and every
    # fleet module, so none of those was ever checked for dead code. main
    # added `publish_catalog.py` to both lists while this branch was open,
    # which is the drift happening again and the reason for the glob.
    args = ["src/lst", "fleet/upload.py", "--min-confidence", "80"],
    pass_filenames = false,
  },
]

# Prose rules. Third-party packages are pinned in .vale.ini; repository-owned
# rules and their rationale live in styles/ and styles/NOTICE.
[[repos]]
repo = "https://github.com/vale-cli/vale"
rev = "v3.19.0"
hooks = [
  { id = "vale", name = "vale sync", args = ["sync"], pass_filenames = false },
  {
    id = "vale",
    name = "vale (documentation errors)",
    args = ["--output=line", "--minAlertLevel=error"],
    types = ["markdown"],
  },
  {
    id = "vale",
    alias = "vale-audit",
    name = "vale (full prose audit)",
    args = ["--output=line", "--minAlertLevel=suggestion"],
    types = ["markdown"],
    stages = ["manual"],
  },
]

# These editorial checks are advisory because their findings require judgment.
# Run them with `prek run proselint --all-files --hook-stage manual`.
[[repos]]
repo = "https://github.com/amperser/proselint"
rev = "v0.16.0"
hooks = [
  {
    id = "proselint",
    args = ["check", "--config", "proselint.json"],
    types = ["markdown"],
    stages = ["manual"],
  },
]

# =============================================================================
# Local hooks
# =============================================================================
[[repos]]
repo = "local"
hooks = [
  # Spell checking.
  {
    id = "codespell",
    name = "spell check",
    entry = "uvx codespell",
    language = "system",
    types_or = ["python", "markdown"],
  },

  # Type checking. `tests` on the search path because the test modules import
  # their shared fixtures from `conftest` by bare name, the way pytest resolves
  # them. `fleet` because `tests/test_fleet_launch.py` imports `upload`, which
  # is deliberately outside the package. The equivalent `[environment]
  # extra-paths` key in ty.toml has no effect, which was measured.
  {
    id = "ty",
    name = "ty type check",
    entry = "uv run ty check --extra-search-path tests --extra-search-path fleet",
    language = "system",
    types = ["python"],
    pass_filenames = false,
  },

  # Import contracts. States the layering `src/lst/__init__.py` describes in
  # prose, and that the run path reaches neither `lst.fleet` nor `lst.measure`.
  # It found a real cycle on its first run: `shard_lst_p95` read the prep
  # schema version through a deferred `import tile_prep`, while `tile_prep`
  # imported `shard_lst_p95` at module level.
  {
    id = "lint-imports",
    name = "import contracts",
    entry = "uv run lint-imports --no-logo",
    language = "system",
    types = ["python"],
    pass_filenames = false,
  },

  # Declared dependencies against imported ones. This is the gate that would
  # have caught `pystac`, `botocore` and `affine` being imported and declared
  # nowhere. The module-name map is a namespace-package gap and nothing else:
  # `odc.geo` and `odc.stac` both import as `odc`.
  {
    id = "deptry",
    name = "dependency declarations",
    entry = "uvx deptry . --no-ansi",
    language = "system",
    types = ["python"],
    pass_filenames = false,
  },

  # Unit tests on pre-push. They assert the figures FINDINGS.md publishes.
  # They take minutes, not the seconds this comment once claimed, because
  # several of them drive a real frisky cluster. `addopts` in pyproject.toml
  # parallelises them; the measurements are there.
  {
    id = "pytest",
    name = "unit tests",
    entry = "uv run pytest",
    language = "system",
    pass_filenames = false,
    stages = ["pre-push"],
  },

  # --- Advisory. Manual stage, because each one needs judgment. ---
  #
  #     prek run radon --all-files --hook-stage manual
  #     prek run xenon --all-files --hook-stage manual
  #     prek run jscpd --all-files --hook-stage manual
  {
    id = "radon",
    name = "radon (complexity report)",
    entry = "uvx radon cc -n C -s --total-average src/lst",
    language = "system",
    pass_filenames = false,
    stages = ["manual"],
  },
  {
    id = "xenon",
    name = "xenon (complexity grades)",
    entry = "uvx xenon --max-average A --max-modules C --max-absolute C src/lst",
    language = "system",
    pass_filenames = false,
    stages = ["manual"],
  },
  {
    id = "jscpd",
    name = "jscpd (duplication report)",
    entry = "npm exec --yes -- jscpd src tests --min-lines 12 --min-tokens 60 --reporters console --format python",
    language = "system",
    pass_filenames = false,
    stages = ["manual"],
  },
]

# =============================================================================
# Advisory rather than blocking, and why
# =============================================================================
#
# xenon   ruff's C901 blocks instead. xenon grades a whole module and offers no
#         per-function escape, so as a gate it either fails on the
#         argparse-and-report `main` functions or has to be set so loose that
#         it gates nothing. C901 gates each function at 12 and names the two
#         entry points it exempts, each with a `# noqa: C901` and a reason.
#         See ruff.toml. xenon still reports: at `--max-absolute C` the whole
#         package passes except `shard_lst_p95.main` (F, 56),
#         `cost_report.main` (E, 36) and `measure.s3_requests.main` (D, 23).
#
# radon   A report, not a threshold. `cc -n C` lists what xenon would grade.
#
# jscpd   MEASURED at 0.04% duplication over 30,533 lines at 12 lines and 60
#         tokens. Below that threshold it reports the PEP 723 headers and the
#         `sys.path` preambles the tests share, which are the measurement
#         rather than a copy. A blocking gate at that sensitivity would fail on
#         its own false positives.
