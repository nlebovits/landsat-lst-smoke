# prek configuration.
# Install: prek install (requires: uv tool install prek)
#
# Adapted from nlebovits/landsat-lst. That repository is a package with
# src/ and a pyproject.toml; this one is a set of standalone PEP 723
# benchmark scripts and the evidence they produced. pyproject.toml here
# exists so the gates have somewhere to resolve against, not to make the
# repository importable.

fail_fast = true

# Measurement artifacts. The whitespace hooks would rewrite committed
# evidence, and none of it is handwritten.
exclude = "^(dryrun/(?!.*\\.py$)|ec2-results/|full/|fulltile/|s3-requests/|shard-run/|smoke/|smoke2/|split/|sweep/|.*\\.log$)"

# =============================================================================
# Built-in hooks (native Rust, no network fetch required)
# =============================================================================
[[repos]]
repo = "builtin"
hooks = [
  # --- Format & whitespace ---
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },

  # --- Syntax validation ---
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },

  # --- Safety & security ---
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "check-case-conflict" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
  {
    id = "check-added-large-files",
    args = ["--maxkb=500"],
    # Two committed memory series predate this config: a 100 ms psutil
    # sample over a 139 s run and over an 18.6 min one. They are the
    # evidence behind the memory findings and no summary replaces them.
    # Excluded by exact path, so the 500 KB ceiling still catches a COG
    # or a parquet committed by accident.
    exclude = { glob = ["full/memory.csv", "ec2-results/quartertile/qt-v2/memory.csv"] },
  },
]

# =============================================================================
# External tool hooks
# =============================================================================
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.14.1"
hooks = [
  { id = "ruff", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/jendrikseipp/vulture"
rev = "v2.14"
hooks = [
  {
    id = "vulture",
    args = [
      "cost_report.py",
      "measure_s3_requests.py",
      "profile_lst_p95.py",
      "shard_lst_p95.py",
      "sweep_throughput.py",
      "dryrun",
      "vulture_whitelist.py",
      "--min-confidence",
      "80",
    ],
    pass_filenames = false,
  },
]

# Prose rules. Third-party packages are pinned in .vale.ini; repository-owned
# rules and their rationale live in styles/ and styles/NOTICE.
[[repos]]
repo = "https://github.com/vale-cli/vale"
rev = "v3.19.0"
hooks = [
  { id = "vale", name = "vale sync", args = ["sync"], pass_filenames = false },
  {
    id = "vale",
    name = "vale (documentation errors)",
    args = ["--output=line", "--minAlertLevel=error"],
    types = ["markdown"],
  },
  {
    id = "vale",
    alias = "vale-audit",
    name = "vale (full prose audit)",
    args = ["--output=line", "--minAlertLevel=suggestion"],
    types = ["markdown"],
    stages = ["manual"],
  },
]

# These editorial checks are advisory because their findings require judgment.
# Run them with `prek run proselint --all-files --hook-stage manual`.
[[repos]]
repo = "https://github.com/amperser/proselint"
rev = "v0.16.0"
hooks = [
  {
    id = "proselint",
    args = ["check", "--config", "proselint.json"],
    types = ["markdown"],
    stages = ["manual"],
  },
]

# =============================================================================
# Local hooks
# =============================================================================
[[repos]]
repo = "local"
hooks = [
  # Spell checking.
  {
    id = "codespell",
    name = "spell check",
    entry = "uvx codespell",
    language = "system",
    types_or = ["python", "markdown"],
  },

  # Type checking. `--extra-search-path .` puts the repository root on the
  # module path, which measure_s3_requests.py needs: it imports shard_lst_p95
  # after a sys.path insert. ty.toml carries the rest of the settings.
  {
    id = "ty",
    name = "ty type check",
    entry = "uv run ty check --extra-search-path .",
    language = "system",
    types = ["python"],
    pass_filenames = false,
  },

  # Unit tests on pre-push. They run in about 4 seconds, and they assert the
  # figures FINDINGS.md publishes.
  {
    id = "pytest",
    name = "unit tests",
    entry = "uv run pytest",
    language = "system",
    pass_filenames = false,
    stages = ["pre-push"],
  },
]

# =============================================================================
# Not here, and why
# =============================================================================
#
# xenon   ruff's C901 replaces it. xenon grades a whole module and offers no
#         per-function escape, so on this repository it either fails on the
#         argparse-and-report `main` functions or has to be set so loose that
#         it gates nothing. C901 gates each function at 12 and names the three
#         entry points it exempts, each with a `# noqa: C901` and a reason.
#         See ruff.toml.
