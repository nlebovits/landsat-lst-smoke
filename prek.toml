# prek configuration.
# Install: prek install (requires: uv tool install prek)
#
# Adapted from nlebovits/landsat-lst. That repository is a package with
# src/, tests/ and a pyproject.toml. This one is a set of standalone
# PEP 723 benchmark scripts and the evidence they produced, so the hooks
# that need a project environment or a test suite are absent. Each
# omission carries its reason below.

fail_fast = true

# Measurement artifacts. The whitespace hooks would rewrite committed
# evidence, and none of it is handwritten.
exclude = "^(dryrun/(?!.*\\.py$)|ec2-results/|full/|fulltile/|s3-requests/|shard-run/|smoke/|smoke2/|split/|sweep/|.*\\.log$)"

# =============================================================================
# Built-in hooks (native Rust, no network fetch required)
# =============================================================================
[[repos]]
repo = "builtin"
hooks = [
  # --- Format & whitespace ---
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "mixed-line-ending" },

  # --- Syntax validation ---
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-json" },

  # --- Safety & security ---
  { id = "check-merge-conflict" },
  { id = "detect-private-key" },
  { id = "check-case-conflict" },
  { id = "no-commit-to-branch", args = ["--branch", "main"] },
  {
    id = "check-added-large-files",
    args = ["--maxkb=500"],
    # Two committed memory series predate this config: a 100 ms psutil
    # sample over a 139 s run and over an 18.6 min one. They are the
    # evidence behind the memory findings and no summary replaces them.
    # Excluded by exact path, so the 500 KB ceiling still catches a COG
    # or a parquet committed by accident.
    exclude = { glob = ["full/memory.csv", "ec2-results/quartertile/qt-v2/memory.csv"] },
  },
]

# =============================================================================
# External tool hooks
# =============================================================================
[[repos]]
repo = "https://github.com/astral-sh/ruff-pre-commit"
rev = "v0.14.1"
hooks = [
  { id = "ruff", args = ["--fix"] },
  { id = "ruff-format" },
]

[[repos]]
repo = "https://github.com/jendrikseipp/vulture"
rev = "v2.14"
hooks = [
  {
    id = "vulture",
    args = [
      "cost_report.py",
      "measure_s3_requests.py",
      "profile_lst_p95.py",
      "shard_lst_p95.py",
      "sweep_throughput.py",
      "dryrun",
      "vulture_whitelist.py",
      "--min-confidence",
      "80",
    ],
    pass_filenames = false,
  },
]

# Prose rules. Third-party packages are pinned in .vale.ini; repository-owned
# rules and their rationale live in styles/ and styles/NOTICE.
[[repos]]
repo = "https://github.com/vale-cli/vale"
rev = "v3.19.0"
hooks = [
  { id = "vale", name = "vale sync", args = ["sync"], pass_filenames = false },
  {
    id = "vale",
    name = "vale (documentation errors)",
    args = ["--output=line", "--minAlertLevel=error"],
    types = ["markdown"],
  },
  {
    id = "vale",
    alias = "vale-audit",
    name = "vale (full prose audit)",
    args = ["--output=line", "--minAlertLevel=suggestion"],
    types = ["markdown"],
    stages = ["manual"],
  },
]

# These editorial checks are advisory because their findings require judgment.
# Run them with `prek run proselint --all-files --hook-stage manual`.
[[repos]]
repo = "https://github.com/amperser/proselint"
rev = "v0.16.0"
hooks = [
  {
    id = "proselint",
    args = ["check", "--config", "proselint.json"],
    types = ["markdown"],
    stages = ["manual"],
  },
]

# =============================================================================
# Local hooks
# =============================================================================
[[repos]]
repo = "local"
hooks = [
  # Spell checking. `uvx` rather than `uv run`, because this repository has
  # no pyproject.toml to resolve against.
  {
    id = "codespell",
    name = "spell check",
    entry = "uvx codespell",
    language = "system",
    types_or = ["python", "markdown"],
  },
]

# =============================================================================
# Omitted, with reasons
# =============================================================================
#
# ty            The scripts carry PEP 723 inline dependencies rather than a
#               shared environment, so `ty` resolves none of odc-stac, dask,
#               xarray or frisky. 44 of its 83 diagnostics here are
#               unresolved-import against those packages. Restoring it needs
#               a pyproject.toml that installs every script's dependencies.
#
# xenon         The four benchmark scripts each end in a long argparse-and-
#               report `main`, ranked D, E and F on cyclomatic complexity.
#               These scripts record one session's measurements rather than
#               serve as a library, so the refactor that would satisfy
#               --max-absolute=C buys nothing.
#
# pytest-unit   No test suite exists. The correctness checks in this
#               repository are the coverage and output-equivalence assertions
#               inside shard_lst_p95.py, which run as part of a real job.
